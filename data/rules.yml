version: "3.1"

rules:
  # =====================================================================
  # RULE 1: TẠM BIỆT
  # =====================================================================
  - rule: Say goodbye anytime the user says goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  # =====================================================================
  # RULE 2: XÁC NHẬN BOT
  # =====================================================================
  - rule: Say 'I am a bot' anytime the user challenges
    steps:
      - intent: bot_challenge
      - action: utter_iamabot

  # =====================================================================
  # RULE 3: CHÀO HỎI
  # =====================================================================
  - rule: Greet user
    steps:
      - intent: greet
      - action: utter_greet

  # =====================================================================
  # RULE 4: TRỢ GIÚP
  # =====================================================================
  - rule: Provide help
    steps:
      - intent: help
      - action: action_help

  # =====================================================================
  # RULE 5: ĐỊA CHỈ CỬA HÀNG
  # =====================================================================
  - rule: Tell store location
    steps:
      - intent: ask_location
      - action: utter_location

  # =====================================================================
  # RULE 6: GIAO HÀNG
  # =====================================================================
  - rule: Tell delivery info
    steps:
      - intent: ask_delivery
      - action: utter_delivery

  # =====================================================================
  # RULE 7: GIỜ MỞ CỬA
  # =====================================================================
  - rule: Tell opening hours
    steps:
      - intent: ask_opening_hours
      - action: utter_opening_hours

  # =====================================================================
  # RULE 8: NÓI CHUYỆN PHIẾM
  # =====================================================================
  - rule: Respond to chitchat
    steps:
      - intent: chitchat
      - action: utter_chitchat
