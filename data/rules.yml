version: "3.1"

rules:
  # =====================================================================
  # RULE 1: TẠM BIỆT
  # =====================================================================
  - rule: Say goodbye anytime the user says goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  # =====================================================================
  # RULE 2: XÁC NHẬN BOT
  # =====================================================================
  - rule: Say 'I am a bot' anytime the user challenges
    steps:
      - intent: bot_challenge
      - action: utter_iamabot

  # =====================================================================
  # RULE 3: CHÀO HỎI
  # =====================================================================
  - rule: Greet user
    steps:
      - intent: greet
      - action: utter_greet

  # =====================================================================
  # RULE 4: TRỢ GIÚP
  # =====================================================================
  - rule: Provide help
    steps:
      - intent: help
      - action: action_help
